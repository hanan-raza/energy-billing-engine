services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ["sqlserver"]
    environment:
      SA_PASSWORD: "Billing_Dev_2026!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'Billing_Dev_2026!' -Q 'SELECT 1'"]
      interval: 15s
      timeout: 10s
      retries: 10

  oracle:
    image: gvenzl/oracle-free:23-slim
    profiles: ["oracle"]
    environment:
      ORACLE_PASSWORD: "Billing_Dev_2026!"
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 30s
      timeout: 20s
      retries: 20

volumes:
  sqlserver_data:
  oracle_data:
