services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ["sqlserver"]
    environment:
      MSSQL_SA_PASSWORD: "Billing_Dev_2026!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      # The 2022 image ships sqlcmd in mssql-tools18, which encrypts by default; -C trusts the dev certificate.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Billing_Dev_2026!' -C -Q 'SELECT 1'"]
      interval: 15s
      timeout: 10s
      retries: 10

  oracle:
    image: gvenzl/oracle-free:23-slim
    profiles: ["oracle"]
    environment:
      ORACLE_PASSWORD: "Billing_Dev_2026!"
      # Creates the application schema in the FREEPDB1 pluggable database on first start.
      APP_USER: billing
      APP_USER_PASSWORD: "Billing_Dev_2026!"
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 30s
      timeout: 20s
      retries: 20

volumes:
  sqlserver_data:
  oracle_data:
