name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Unit tests run in both legs; each leg runs the integration tests of one database (Testcontainers).
        database: [SqlServer, Oracle]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test (${{ matrix.database }})
        run: >-
          dotnet test --no-build --configuration Release
          --filter "Category!=Integration|Database=${{ matrix.database }}"
          --logger "trx;LogFilePrefix=results-${{ matrix.database }}"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.database }}
          path: ./TestResults/*.trx
